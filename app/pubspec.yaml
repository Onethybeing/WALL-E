name: wall_e
description: "WALL-E: a digital pet agent with animated eyes, voice, and tool access."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Camera-based face tracking (Android/iOS only -- no web implementation,
  # so all usage is guarded behind kIsWeb checks in face_tracking.dart).
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.2

  # Mic recording for mic_listen() (brain/tools.py), via bridge_server.dart's
  # /listen endpoint -- not Termux:API's RECORD_AUDIO, which `adb shell cmd
  # appops get com.termux.api` shows capped at AppOps mode "foreground" at
  # the *uid* level (can't be overridden per-package) on this device/ROM,
  # silently returning zeroed/empty audio instead of erroring. Same root
  # cause already worked around for camera (analyze_photo) and location
  # (get_location) -- WALL-E's own RECORD_AUDIO AppOps is a healthy "allow"
  # (confirmed via the same adb command), so recording through this app
  # instead actually works.
  record: ^6.1.1
  path_provider: ^2.1.5

  # Persistent "Dynamic Island"-style overlay -- stays visible system-wide,
  # not just while the eyes screen is in the foreground. Renders a second,
  # separate Flutter engine into an Android overlay window (SYSTEM_ALERT_WINDOW),
  # which -- like the Accessibility Service -- can't be silently granted;
  # the person has to approve "display over other apps" manually.
  #
  # NOTE: tried flutter_overlay_window_plus first -- its OverlayService.java
  # turned out to be a plain native View/TextView overlay, not an actual
  # Flutter engine, so overlayTitle/overlayContent are just text, not a
  # real widget tree. flutter_overlay_window (no "_plus") is the original,
  # genuinely renders a second FlutterEngine via the documented
  # @pragma("vm:entry-point") entry point.
  flutter_overlay_window: ^0.5.0

  # Wake-word, take 3: sherpa-onnx's native keyword spotter crashed
  # reproducibly (Ort::Exception reshape error, SIGABRT -- genuine
  # model/runtime incompatibility, confirmed not fixable by adjusting our
  # integration). Porcupine was tried next and dropped for a compileSdk 31
  # conflict with camera/mlkit's AndroidX requirements -- re-checked its
  # current GitHub source (Dec 2025 release) and it still hardcodes
  # `compileSdkVersion 31`, so that's still blocked upstream, unfixed.
  # speech_to_text wraps Android's own SpeechRecognizer -- no native model,
  # no compileSdk conflict (just needs compileSdkVersion 31+, which this
  # app already has). It doesn't support true continuous listening
  # natively (its own docs say so), so wake_word.dart works around that
  # with a restart-on-timeout loop instead -- see its doc comment.
  speech_to_text: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon_source.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # No bundled assets currently -- the sherpa-onnx keyword-spotter models
  # that used to live under assets/sherpa_kws/ were for an approach dropped
  # entirely (native crash, see wake_word.dart), and the Rive eye rig's
  # assets/rive/eyes.riv was replaced by the scanner-visor character
  # (scanner_visor.dart), which is drawn in code, not loaded from a file.

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
